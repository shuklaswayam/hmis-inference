name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # The backend tests rely on mocks (see tests/conftest.py; no Postgres,
    # Redis, or Chroma required), so no service containers are started.
    defaults:
      run:
        working-directory: hmis-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            hmis-inference/requirements.txt
            hmis-inference/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/hmis-inference
        run: pytest tests/ -v --tb=short --no-header -q

  frontend:
    name: Frontend (tsc / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hmis-inference/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # GitHub deprecated Node 20 on runners 2026-04; use Node 24 default.
          node-version: '24'
          cache: npm
          cache-dependency-path: hmis-inference/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # CI build is a smoke check; no real backend URL required.
          VITE_API_BASE_URL: http://localhost:8000

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t hmis-inference:ci hmis-inference/
      # NOTE: an optional `docker compose up -d` smoke + `curl /health`
      # job can be added here once a real GROQ_API_KEY is registered as
      # a repo secret (`secrets.GROQ_API_KEY`). It is intentionally
      # omitted so the default CI works with no secrets configured.
